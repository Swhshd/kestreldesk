  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-security:
        applies-to: security-updates
        patterns: ["*"]
      go-nonbreaking:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
      go-major:
        applies-to: version-updates
        update-types: ["major"]
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-nonbreaking:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
      actions-major:
        applies-to: version-updates
        update-types: ["major"]
        patterns: ["*"]
